<!DOCTYPE html>
<html>
<head>
    <title>FinTrack</title>
</head>
<body>
    <h1>FinTrack</h1>
    <p>Personal Expense Tracker</p>
    <p><a href="/add">+ Add Expense</a></p>

    <h2>Expense History</h2>
    {% if expenses %}
    <table border="1" cellpadding="6">
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Description</th>
        </tr>
        {% for e in expenses %}
        <tr>
            <td>{{ e["date"] }}</td>
            <td>{{ e["category"] }}</td>
            <td>{{ e["amount"] }}</td>
            <td>{{ e["description"] }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No expenses yet.</p>
    {% endif %}
</body>
</html>
