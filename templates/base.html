<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinTrack{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">Fin<span>Track</span></div>
        <nav>
            <a href="{{ url_for('home') }}" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
            <a href="{{ url_for('history') }}" class="{{ 'active' if request.path == '/history' else '' }}">History</a>
            <a href="{{ url_for('add_expense') }}" class="{{ 'active' if request.path == '/add' else '' }}">+ Add Expense</a>
        </nav>
    </aside>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
