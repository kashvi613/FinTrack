{% extends "base.html" %}

{% block title %}{{ 'Edit' if editing else 'Add' }} Expense - FinTrack{% endblock %}

{% block content %}
<h1>{{ 'Edit Expense' if editing else 'Add Expense' }}</h1>

<div class="card form-card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label>Amount (₹)</label>
        <input type="number" name="amount" step="0.01" min="0.01" value="{{ form['amount'] }}" required>

        <label>Category</label>
        <select name="category" required>
            {% for c in categories %}
            <option value="{{ c }}" {{ 'selected' if c == form['category'] else '' }}>{{ c }}</option>
            {% endfor %}
        </select>

        <label>Date</label>
        <input type="date" name="date" value="{{ form['date'] }}" required>

        <label>Description</label>
        <input type="text" name="description" maxlength="100" value="{{ form['description'] }}" placeholder="e.g. Lunch with friends">

        <button type="submit" class="btn">{{ 'Save Changes' if editing else 'Save Expense' }}</button>
        {% if editing %}
        <a href="{{ url_for('history') }}" class="cancel-link">Cancel</a>
        {% endif %}
    </form>
</div>
{% endblock %}
